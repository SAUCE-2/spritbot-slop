# Runs on the Steam Machine under rootless Podman (deck user). Watchtower pulls new images that CI pushes to GHCR.
services:
  spiritbot:
    image: ghcr.io/sauce-2/spritbot-slop:latest
    env_file: .env
    volumes:
      - spiritbot-data:/data
    restart: always
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    # Maintained fork (containrrr/watchtower is archived and breaks on Docker 29+).
    image: nickfedor/watchtower
    command: --label-enable --interval 120 --cleanup
    volumes:
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock
    restart: always

volumes:
  spiritbot-data:
