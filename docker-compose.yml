# Production setup. Watchtower pulls new images from GHCR and restarts the bot automatically.
# Rootless Podman? Watchtower doesn't work there; see "Rootless Podman" in the README.
services:
  spiritbot:
    image: ghcr.io/sauce-2/spritbot-slop:latest
    env_file: .env
    volumes:
      - spiritbot-data:/data
    restart: always
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    # Maintained fork (containrrr/watchtower is archived and breaks on Docker 29+).
    image: nickfedor/watchtower
    command: --label-enable --interval 120 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

volumes:
  spiritbot-data:
